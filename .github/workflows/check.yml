# SPDX-License-Identifier: Apache-2.0
name: check
on:
  push:
    branches: [android-6.0.1_r31, android-4.4.4]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check the tree
        run: python3 tools/check_tree.py .
